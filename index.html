        font-size:15px;
        outline:none;
        transition:all .25s ease;

        background:var(--glass);
        backdrop-filter:blur(20px);
        color:var(--text-muted);
        font-size:15px;
        cursor:pointer;
        outline:none;
        min-width:130px;
        box-shadow:var(--shadow-sm);
    }

    #filterOptions option {

    .zone-item {

        display:flex;
        flex-direction:column;
        position:relative;
        box-shadow:var(--shadow-sm);

    .zone-item:hover {
